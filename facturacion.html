<title>Facturación · Pctronic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tailwind.min.css?v=2.3" />
<link rel="stylesheet" href="assets/css/styles.css" />
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="assets/js/config.js"></script>
<script defer src="assets/js/supabaseClient.js"></script>
<script defer src="assets/js/util.js?v=2.3"></script>
<script defer src="assets/js/excel.js"></script>
<script defer src="assets/js/pdf.js"></script>
</head>
<body data-page="facturacion" data-title="Facturación" class="font-display bg-gray-50 text-gray-900 antialiased">

<div id="app-sidebar"></div>
<div class="lg:pl-64">
  <div id="app-topbar"></div>

  <main class="p-6 space-y-4">
    <p class="text-sm text-gray-500">
      Vista global de todas las facturas de todos los proyectos. Para registrar una factura nueva, entra al proyecto correspondiente → pestaña "Facturación".
    </p>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
      <div class="rounded-xl border border-gray-200 bg-white p-4">
        <p class="text-xs font-medium text-gray-500">Total Facturado</p>
        <p class="text-lg font-bold" id="kpi-total">$ 0</p>
      </div>
      <div class="rounded-xl border border-gray-200 bg-white p-4">
        <p class="text-xs font-medium text-gray-500">Total Pagado</p>
        <p class="text-lg font-bold text-green-600" id="kpi-pagado">$ 0</p>
      </div>
      <div class="rounded-xl border border-amber-200 bg-amber-50 p-4">
        <p class="text-xs font-medium text-amber-700">Pendiente por Cobrar</p>
        <p class="text-lg font-bold text-amber-700" id="kpi-pendiente">$ 0</p>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <input id="filtro-busqueda" type="search" placeholder="Buscar por proyecto o N° factura..." aria-label="Buscar por proyecto o número de factura"
        class="w-full sm:w-72 rounded-lg border-gray-300 text-sm shadow-sm focus:border-primary focus:ring-primary" />
      <select id="filtro-estado" aria-label="Filtrar por estado" class="rounded-lg border-gray-300 text-sm shadow-sm focus:border-primary focus:ring-primary">
        <option value="">Estado: Todos</option>
        <option value="pendiente">Pendiente</option>
        <option value="pagada">Pagada</option>
        <option value="vencida">Vencida</option>
        <option value="anulada">Anulada</option>
      </select>
      <select id="filtro-empresa" aria-label="Filtrar por empresa" class="rounded-lg border-gray-300 text-sm shadow-sm focus:border-primary focus:ring-primary">
        <option value="">Empresa: Todas</option>
      </select>
      <input id="filtro-mes" type="month" aria-label="Filtrar por mes de emisión" class="rounded-lg border-gray-300 text-sm shadow-sm focus:border-primary focus:ring-primary" title="Filtrar por mes de emisión" />
      <div class="ml-auto flex gap-2">
        <button id="btn-exportar-excel" class="flex items-center gap-1 rounded-lg border border-gray-300 px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-50">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">download</span> Excel
        </button>
        <button id="btn-exportar-pdf" class="flex items-center gap-1 rounded-lg border border-gray-300 px-3 py-2 text-xs font-semibold text-gray-700 hover:bg-gray-50">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">picture_as_pdf</span> PDF
        </button>
      </div>
    </div>

    <div class="overflow-x-auto rounded-xl border border-gray-200 bg-white">
      <table class="w-full text-left text-sm">
        <thead class="bg-gray-50 text-xs uppercase text-gray-500">
          <tr>
            <th class="px-4 py-3">Empresa</th>
            <th class="px-4 py-3">Proyecto</th>
            <th class="px-4 py-3">N° Factura</th>
            <th class="px-4 py-3">Emisión</th>
            <th class="px-4 py-3">Vencimiento</th>
            <th class="px-4 py-3">Valor</th>
            <th class="px-4 py-3">Estado</th>
          </tr>
        </thead>
        <tbody id="tabla-facturas">
          <tr aria-live="polite"><td class="px-4 py-6 text-gray-500" colspan="7">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script defer src="assets/js/layout.js?v=2.3"></script>
<script defer src="assets/js/facturacion.js"></script>
</body>
</html>
