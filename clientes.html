<title>Clientes · Pctronic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tailwind.min.css?v=2.3" />
<link rel="stylesheet" href="assets/css/styles.css" />
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" integrity="sha384-YieCqqg9gQufX7+5HcFvCEg/n3KUEdl8/Jb+A6J0npf1mB740VayvwKjTrtCeUoy" crossorigin="anonymous"></script>
<script defer src="assets/js/config.js"></script>
<script defer src="assets/js/supabaseClient.js"></script>
<script defer src="assets/js/util.js?v=2.3"></script>

</head>
<body data-page="clientes" data-title="Clientes" data-catalogo="clientes" class="font-display bg-gray-50 text-gray-900 antialiased">

<div id="app-sidebar"></div>
<div class="lg:pl-64">
  <div id="app-topbar"></div>

  <main class="p-6 space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <input id="filtro-busqueda" type="search" placeholder="Buscar cliente..." aria-label="Buscar cliente"
        class="w-full sm:w-72 rounded-lg border-gray-300 text-sm shadow-sm focus:border-primary focus:ring-primary" />
      <button id="btn-exportar" class="flex items-center gap-2 rounded-lg border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50"><span class="material-symbols-outlined text-[18px]" aria-hidden="true">download</span> Exportar Excel</button>
      <button id="btn-nuevo" class="flex items-center gap-2 rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">add</span> Nuevo Cliente
      </button>
    </div>
    <p class="text-xs text-gray-500">Haz clic en una fila para ver y administrar sus contactos (contabilidad, compras, proyectos).</p>

    <div class="overflow-x-auto rounded-xl border border-gray-200 bg-white">
      <table class="w-full text-left text-sm">
        <thead class="bg-gray-50 text-xs uppercase text-gray-500">
          <tr>
            <th class="px-4 py-3">Nombre</th>
            <th class="px-4 py-3">NIT</th>
            <th class="px-4 py-3">Notas</th>
            <th class="px-4 py-3"></th>
          </tr>
        </thead>
        <tbody id="tabla-catalogo">
          <tr aria-live="polite"><td class="px-4 py-6 text-gray-500" colspan="4">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<div id="modal-catalogo" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-md rounded-xl bg-white p-5 shadow-xl">
    <h3 id="modal-titulo" class="mb-4 text-base font-bold text-gray-900">Nuevo registro</h3>
    <div id="modal-campos" class="space-y-3"></div>
    <div class="mt-5 flex justify-end gap-2">
      <button id="modal-cancelar" class="rounded-lg border border-gray-300 px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-50">Cancelar</button>
      <button id="modal-guardar" class="rounded-lg bg-primary px-3 py-1.5 text-sm font-semibold text-white hover:bg-blue-700">Guardar</button>
    </div>
  </div>
</div>

<script defer src="assets/js/layout.js?v=2.3"></script>
<script defer src="assets/js/pages/catalogos-config.js?v=2.3"></script>
<script defer src="assets/js/catalogo.js"></script>
</body>
</html>
