<title>Tercero · Pctronic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: "#135bec" }, fontFamily: { display: ["Inter", "sans-serif"] } } },
  };
</script>
<link rel="stylesheet" href="assets/css/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/supabaseClient.js"></script>
<script src="assets/js/util.js"></script>
</head>
<body data-page="terceros" data-title="Detalle de Tercero" class="font-display bg-gray-50 text-gray-900 antialiased">

<div id="app-sidebar"></div>
<div class="lg:pl-64">
  <div id="app-topbar"></div>

  <main class="p-6 space-y-6">
    <div class="flex items-center gap-2 text-sm text-gray-500">
      <a href="terceros.html" class="hover:text-primary flex items-center gap-1">
        <span class="material-symbols-outlined text-[18px]">arrow_back</span> Terceros
      </a>
      <span>/</span>
      <span id="detalle-nombre" class="font-medium text-gray-800">—</span>
    </div>

    <section class="rounded-xl border border-gray-200 bg-white p-5 space-y-4">
      <h2 class="text-base font-bold text-gray-900">Datos del tercero</h2>
      <div class="grid gap-4 sm:grid-cols-3">
        <div>
          <label class="mb-1 block text-xs font-semibold text-gray-700">Nombre / Razón social *</label>
          <input id="d-nombre" type="text" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-semibold text-gray-700">NIT / Identificación</label>
          <input id="d-identificacion" type="text" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-semibold text-gray-700">Teléfono</label>
          <input id="d-telefono" type="text" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-semibold text-gray-700">Correo electrónico</label>
          <input id="d-email" type="email" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-semibold text-gray-700">Dirección</label>
          <input id="d-direccion" type="text" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-semibold text-gray-700">Notas</label>
          <input id="d-notas" type="text" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
        </div>
      </div>

      <div class="rounded-lg border border-gray-200 bg-gray-50 p-3">
        <p class="mb-2 text-xs font-semibold uppercase text-gray-600">Roles</p>
        <div class="flex flex-wrap gap-6">
          <label class="flex items-center gap-2 text-sm font-medium cursor-pointer">
            <input id="d-es-cliente" type="checkbox" class="rounded border-gray-300 text-primary focus:ring-primary" /> Es Cliente
          </label>
          <label class="flex items-center gap-2 text-sm font-medium cursor-pointer">
            <input id="d-es-proveedor" type="checkbox" class="rounded border-gray-300 text-primary focus:ring-primary" /> Es Proveedor
          </label>
          <label class="flex items-center gap-2 text-sm font-medium cursor-pointer">
            <input id="d-es-contratista" type="checkbox" class="rounded border-gray-300 text-primary focus:ring-primary" /> Es Contratista
          </label>
        </div>
      </div>

      <div id="d-sec-proveedor" class="hidden rounded-lg border border-blue-200 bg-blue-50/40 p-3 grid gap-3 sm:grid-cols-5">
        <div>
          <label class="mb-1 block text-xs font-medium text-gray-700">Categoría</label>
          <input id="d-categoria" type="text" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
        </div>
        <div class="flex items-end pb-1.5">
          <label class="flex items-center gap-2 text-xs font-semibold text-gray-800 cursor-pointer">
            <input id="d-aplica-retencion" type="checkbox" class="rounded border-gray-300 text-primary focus:ring-primary" /> Aplica Retención
          </label>
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-gray-700">% Retención</label>
          <input id="d-porcentaje-retencion" type="number" step="0.01" min="0" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-gray-700">% ICA</label>
          <input id="d-porcentaje-ica" type="number" step="0.01" min="0" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-gray-700">Monto mínimo</label>
          <input id="d-monto-minimo" type="number" step="1" min="0" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
        </div>
      </div>

      <div id="d-sec-contratista" class="hidden rounded-lg border border-amber-200 bg-amber-50/40 p-3 grid gap-3 sm:grid-cols-3">
        <div>
          <label class="mb-1 block text-xs font-medium text-gray-700">Especialidad</label>
          <input id="d-especialidad" type="text" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-gray-700">Tipo de persona</label>
          <select id="d-tipo-persona" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary">
            <option value="empresa">Empresa</option>
            <option value="persona_natural">Persona natural</option>
          </select>
        </div>
        <div class="flex items-end pb-1.5">
          <label class="flex items-center gap-2 text-xs font-semibold text-gray-800 cursor-pointer">
            <input id="d-declarante-renta" type="checkbox" class="rounded border-gray-300 text-primary focus:ring-primary" /> Declarante de renta
          </label>
        </div>
      </div>

      <div class="flex justify-end">
        <button id="btn-guardar-tercero" class="rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Guardar cambios</button>
      </div>
    </section>

    <section class="rounded-xl border border-gray-200 bg-white p-5">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="text-base font-bold text-gray-900">Contactos</h2>
        <button id="btn-nuevo-contacto" class="flex items-center gap-2 rounded-lg bg-primary px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">
          <span class="material-symbols-outlined text-[18px]">add</span> Nuevo Contacto
        </button>
      </div>
      <div class="overflow-x-auto rounded-xl border border-gray-200">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 text-xs uppercase text-gray-500">
            <tr>
              <th class="px-4 py-3">Nombre</th>
              <th class="px-4 py-3">Cargo</th>
              <th class="px-4 py-3">Tipo</th>
              <th class="px-4 py-3">Teléfono</th>
              <th class="px-4 py-3">Correo</th>
              <th class="px-4 py-3 text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-contactos">
            <tr><td class="px-4 py-6 text-gray-400" colspan="6">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div id="modal-contacto" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/40 p-4">
  <div class="w-full max-w-md rounded-xl bg-white p-5 shadow-xl">
    <h3 id="modal-contacto-titulo" class="mb-4 text-base font-bold text-gray-900">Nuevo contacto</h3>
    <div class="space-y-3">
      <div>
        <label class="mb-1 block text-xs font-semibold text-gray-700">Nombre *</label>
        <input id="c-nombre" type="text" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-gray-700">Cargo</label>
        <input id="c-cargo" type="text" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-gray-700">Tipo de contacto</label>
        <select id="c-tipo" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary">
          <option value="comercial">Comercial</option>
          <option value="compras">Compras</option>
          <option value="contabilidad">Contabilidad</option>
          <option value="proyectos">Proyectos</option>
          <option value="despacho_logistica">Despacho / Logística</option>
          <option value="cartera">Cartera</option>
          <option value="garantias">Garantías</option>
          <option value="otro">Otro</option>
        </select>
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-gray-700">Teléfono</label>
        <input id="c-telefono" type="text" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
      </div>
      <div>
        <label class="mb-1 block text-xs font-semibold text-gray-700">Correo</label>
        <input id="c-email" type="email" class="block w-full rounded-lg border-gray-300 text-sm focus:border-primary focus:ring-primary" />
      </div>
    </div>
    <div class="mt-5 flex justify-end gap-2">
      <button id="c-cancelar" class="rounded-lg border border-gray-300 px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-50">Cancelar</button>
      <button id="c-guardar" class="rounded-lg bg-primary px-3 py-1.5 text-sm font-semibold text-white hover:bg-blue-700">Guardar</button>
    </div>
  </div>
</div>

<script src="assets/js/layout.js?v=2.2"></script>
<script src="assets/js/tercero-detalle.js"></script>
</body>
</html>
